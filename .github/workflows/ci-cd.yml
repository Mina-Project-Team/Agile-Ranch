name: Build Documentation and Run Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # umożliwia ręczne uruchomienie

# Nadaje uprawnienia do zapisu dla GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zezwala tylko na jedno równoczesne wdrożenie
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby (dla Asciidoctor)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: gem install asciidoctor

      - name: Build HTML documentation
        run: |
          mkdir -p build/html
          asciidoctor -D build/html docs/index.adoc
          # Opcjonalnie kopiujemy obrazy, jeśli są
          if [ -d docs/images ]; then cp -r docs/images build/html/; fi

      # Leaving it here so we can add tests @devops use this
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      # - name: Install test dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install pytest
      # - name: Run minimal test suite
      #   run: pytest tests/ --tb=short

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/html'

  deploy:
    needs: build
    # Only run this job if the workflow was triggered by the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
